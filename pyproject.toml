[project]
name = "finguard-orchestrator"
version = "0.1.0"
description = "Enterprise agentic wealth management compliance & AML audit engine"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-openai",
    "langchain-community",
    "langgraph",
    "chromadb",
    "pypdf",
    "pydantic",
    "redis",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
    "deepeval",
    "ragas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
