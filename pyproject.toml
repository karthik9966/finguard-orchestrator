[project]
name = "finguard-orchestrator"
version = "0.1.0"
description = "Enterprise agentic wealth management compliance & AML audit engine"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-openai",
    "langchain-community",
    "langgraph",
    "chromadb",
    "pypdf",
    "pydantic",
    # Phase 0 of the design migration -- LLD §8's config split. pydantic-settings owns the
    # environment half (secrets, endpoints), PyYAML the config.yaml half (every tunable number).
    "pydantic-settings",
    "pyyaml",
    "sentence-transformers",
    "fastapi",
    "uvicorn",
    "streamlit",
    # Phase 1 §3.2 — dataset acquisition & SWIFT log generation
    "kagglehub",   # authenticated SAML-D pull from Kaggle
    "httpx",       # regulatory corpus fetches
    "pandas",      # SAML-D slicing (currently only a transitive chromadb dep)
    "fpdf2",       # pypdf reads PDFs but cannot write them
    # Phase 1 §3.3 — semantic chunking & retrieval benchmark
    "numpy",         # cosine boundaries, embedding cache (transitive today; imported directly)
    "python-dotenv", # loads .env (same — transitive via chromadb, but we import it)
    # Phase 3 §9.4 — cross-encoder reranking. A runtime dependency, not a dev one: nodes.py
    # imports it at module scope and USE_RERANKER defaults on, so a `--no-dev` install without
    # it dies at import. Caught by the first real Docker build, which is what --no-dev does.
    "flashrank>=0.2.10",
    # Phase 6a §3.2 — the results store. Already present transitively via langchain-community, but
    # `src/store/results.py` imports it directly and the LLD's RESULTS_DB_URL is the whole reason
    # it is here: SQLite in v1 and Postgres in production is a URL change and nothing else.
    "sqlalchemy",
    "langfuse>=4.15.6",
]

[dependency-groups]
dev = [
    "pytest",
    "grandalf",  # backs `finguard-audit --ascii` (langchain's draw_ascii)
    "deepeval",
    # ragas (blueprint §8) is omitted: 0.4.3 imports
    # langchain_community.chat_models.vertexai, removed in
    # langchain-community 0.4.x. deepeval covers the three
    # blueprint metrics. Revisit when upstream fixes it.
    "pytest-cov>=7.1.0",
]

# `uv sync` puts each on PATH. Every target is a
# no-argument `main() -> int`; the generated wrapper passes that to sys.exit.
[project.scripts]
finguard-audit     = "src.graph.run:main"            # batch PDF -> ComplianceReport
finguard-parse     = "src.utils.swift_parser:main"   # MT103 batch -> wires, with stats
finguard-ledger    = "src.utils.pdf_generator:main"  # render SWIFT MT103 monthly logs
finguard-download  = "src.ingestion.download:main"   # fetch both corpora, write the manifest
finguard-map       = "src.ingestion.obliqa_map:main" # ObliQA DocumentIDs -> document titles
finguard-chunk     = "src.ingestion.loader:main"     # semantic chunking -> chunks/*.jsonl
finguard-benchmark = "src.ingestion.benchmark:main"  # recall@k against the gold set
finguard-store     = "src.ingestion.store:main"      # build / query the ChromaDB collection

# The eval suite is not part of the default run: its judge is a gpt-4o call per metric per case.
# `uv run pytest tests/` stays free and needs no key; `-m eval` opts in.
[tool.pytest.ini_options]
markers = [
    "eval: LLM-as-judge scoring (§8). Costs money -- run with `-m eval`.",
]
addopts = "-m 'not eval'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- coverage (LLD §7) ---------------------------------------------------------------------
# The gate is scoped to the modules that run *during an audit*, not to the repository. The omitted
# files are one-off build and acquisition tools -- fetch the corpus, chunk it, render the ledgers,
# run the retrieval benchmark -- each a CLI that is exercised by being run rather than by unit tests,
# and each of which would drag the number down while saying nothing about whether an audit is
# correct. Scoping it explicitly is the honest alternative to reporting a repository-wide figure
# that nobody can act on.
[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/ingestion/download.py",      # network acquisition, run once per corpus refresh
    "src/ingestion/loader.py",        # the corpus build CLI
    "src/ingestion/obliqa_map.py",    # a one-off DocumentID mapping
    "src/ingestion/benchmark.py",     # the retrieval benchmark harness
    "src/utils/pdf_generator.py",     # the synthetic ledger generator
    "src/graph/evalset.py",           # Phase 8's capture harness, superseded by eval/
    "src/ui/cockpit.py",              # a Streamlit script; covered by AppTest, not by import
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured at 85.53% on this scope. The floor is 85: a gate above what the suite actually achieves is
# a gate that gets turned off within a week, and one far below it stops catching anything. The two
# files holding it down are `graph/run.py`'s argparse CLI and `ingestion/store.py`'s, both of which
# are exercised by being run rather than imported.
fail_under = 85
