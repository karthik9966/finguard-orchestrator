# The service and its cache together. Redis is optional by design -- `docker compose up api`
# alone runs uncached and correct -- but running both is the intended shape.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    # 64 MB caps a store that holds ~0.43 MB warm; allkeys-lru means a runaway evicts rather
    # than refusing writes, since every entry here is disposable by construction.
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      REDIS_HOST: redis
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in your environment or .env}
    volumes:
      # Not :ro -- ChromaDB is SQLite underneath and opens a journal even to read.
      - ./chroma_db:/app/chroma_db
    depends_on:
      redis: {condition: service_healthy}
