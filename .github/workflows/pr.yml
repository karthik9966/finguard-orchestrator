# Gate 1 of Evaluation Design §6: fast deterministic feedback on every push.
#
# Fully mocked, so it is fast and free. What it protects is node logic, every Pydantic schema, and the
# "stay quiet on a clean batch" guarantee -- the things whose breakage should never reach main.
#
# **It does not build the corpus.** The knowledge base needs the regulatory sources (fetched over the
# network from eCFR and FFIEC) and SAML-D (a ~1 GB Kaggle download), and a gate that depends on two
# third-party downloads is a gate that fails for reasons unrelated to the change under review. The
# suite is built for this: tests needing generated data skip themselves with the command that would
# produce it, so this run covers the ~400 tests that need nothing, and the nightly job covers the
# rest with the data in place.

name: PR gate

on:
  push:
    branches: [main, "migrate/**"]
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync the locked environment
        run: uv sync --frozen

      # No LLM_API_KEY and no API_AUTH_TOKEN are set on purpose. Every test that would reach a model
      # injects a stub, so a run that somehow made a real call would fail here rather than quietly
      # bill somebody -- which is a stronger guarantee than trusting the stubs.
      - name: Tier 1 -- the deterministic suite, with the coverage gate
        run: uv run pytest tests/ -q --cov --cov-report=term

      - name: The golden datasets still describe themselves
        run: uv run pytest tests/test_golden_datasets.py -q

      - name: Config is live, not decorative
        run: uv run pytest tests/test_config.py -q
